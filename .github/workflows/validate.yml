name: Validate skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependency
        run: python -m pip install PyYAML

      - name: Run prompt validator self-test
        run: python scripts/validate_prompt.py --self-test

      - name: Validate V8 five-second fold example
        run: python scripts/validate_prompt.py examples/V19_5s_EN_borderless_hero_fold_test.txt

      - name: Validate skill metadata
        shell: python
        run: |
          from pathlib import Path
          import re
          import yaml

          skill_text = Path("SKILL.md").read_text(encoding="utf-8")
          match = re.match(r"^---\n(.*?)\n---\n", skill_text, re.S)
          assert match, "SKILL.md must start with YAML frontmatter"
          metadata = yaml.safe_load(match.group(1))
          assert set(metadata) == {"name", "description"}
          assert metadata["name"] == "dimensional-rift-prompt"
          assert metadata["description"].strip()

          ui = yaml.safe_load(Path("agents/openai.yaml").read_text(encoding="utf-8"))
          prompt = ui["interface"]["default_prompt"]
          assert "$dimensional-rift-prompt" in prompt
          print("Skill metadata valid.")
